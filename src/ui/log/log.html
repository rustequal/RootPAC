<!doctype html>
<meta charset="utf-8">
<title>RootPAC — Diagnostic log</title>
<link rel="stylesheet" href="../shared/ui.css">
<body style="max-width: 1200px; margin: 0 auto">
<div id="head"></div>
<div id="banners" class="messages"></div>
<details id="failures" class="failures">
  <summary><span>Proxy failures by host</span><span id="failures-count" class="muted"></span></summary>
  <div id="failures-body"></div>
</details>
<h2>Events</h2>
<div class="row">
  <select id="category">
    <option value="all">All events</option>
    <option value="errors">Errors</option>
    <option value="learning">Learning</option>
    <option value="pages">Pages</option>
    <option value="state">State and configuration</option>
  </select>
  <input id="filter" type="search" placeholder="Filter by host or text" style="flex: 1; width: auto; min-width: 200px">
  <button id="export">Export</button>
  <button id="clear">Clear</button>
</div>
<div class="row pager-bar">
  <p id="summary" class="muted"></p>
  <nav id="pager-top" class="pager" aria-label="Pages of the log"></nav>
</div>
<div id="events" class="events"></div>
<div class="row pager-bar bottom"><nav id="pager-bottom" class="pager" aria-label="Pages of the log"></nav></div>
<p><a href="../options/options.html" target="_blank">Options</a></p>
<script type="module" src="log.js"></script>
</body>
